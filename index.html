<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Two Player Escape Room</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{
  --bg:#12131a; --panel:#1c1e29; --panel2:#262838; --text:#f2f2f7; --sub:#9a9cb0;
  --accent:#5865f2; --accent2:#3ddc97; --danger:#ff5c72;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --bg:#f4f5fb; --panel:#fff; --panel2:#eceefb; --text:#1b1c24; --sub:#63647a; }
}
:root[data-theme="light"]{ --bg:#f4f5fb; --panel:#fff; --panel2:#eceefb; --text:#1b1c24; --sub:#63647a; }
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  display:flex; align-items:center; justify-content:center; min-height:100%; padding:20px;
  padding-top:calc(20px + env(safe-area-inset-top,0px));
  padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
}
.screen{display:none; width:100%; max-width:520px; text-align:center;}
.screen.active{display:block;}
h1{font-size:1.5rem; margin:0 0 6px;}
p.sub{color:var(--sub); margin:0 0 24px;}
.row{display:flex; gap:14px; justify-content:center; flex-wrap:wrap;}
.role-btn{ flex:1 1 140px; max-width:200px; padding:28px 16px; border-radius:16px; border:2px solid var(--panel2); background:var(--panel); color:var(--text); font-size:1.1rem; font-weight:600; cursor:pointer; }
.role-btn:hover{border-color:var(--accent);}
.big-btn{ padding:14px 32px; border-radius:14px; border:none; background:var(--accent); color:#fff; font-size:1.1rem; font-weight:600; cursor:pointer; }
.big-btn:disabled{opacity:.5; cursor:default;}
input.code-input{ font-size:1.4rem; letter-spacing:.3em; text-align:center; text-transform:uppercase; padding:12px; width:160px; border-radius:10px; border:2px solid var(--panel2); background:var(--panel); color:var(--text); margin:0 10px 16px; }
.code-display{ font-size:2.2rem; font-weight:800; letter-spacing:.15em; background:var(--panel); border-radius:14px; padding:18px; margin:16px 0; }
.waiting{color:var(--sub); margin-top:16px;}
.countdown-num{font-size:5rem; font-weight:800;}
.deco{ display:flex; align-items:flex-end; justify-content:center; gap:14px; height:180px; margin:24px auto 8px; padding:0 10px; }
.pillar{width:34px; border-radius:6px 6px 0 0;}
.shelf{ display:flex; gap:16px; justify-content:center; background:var(--panel); border-radius:16px; padding:20px; margin-top:10px; }
.shelf-btn{ width:56px; height:56px; border-radius:50%; border:3px solid var(--panel2); background:var(--panel2); cursor:pointer; }
.shelf-btn:active{transform:scale(0.93);}
.shelf-btn:disabled{opacity:.35; cursor:not-allowed; transform:none;}
.light{ position:relative; width:160px; height:160px; border-radius:50%; margin:24px auto; background:#3a3c4c; box-shadow: inset 0 0 30px rgba(0,0,0,.3); transition:background .4s ease, box-shadow .4s ease; }
.light.needs-color.lit{ box-shadow: inset 0 0 30px rgba(0,0,0,.3), 0 0 0 4px rgba(255,255,255,.85), 0 0 26px 6px rgba(255,255,255,.55); }
.light.needs-color.lit.drag-hover{ box-shadow: inset 0 0 30px rgba(0,0,0,.3), 0 0 0 4px var(--accent2), 0 0 28px 8px rgba(61,220,151,.65); }
.charged-piece{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); cursor:grab; z-index:5; }
.charged-block{ position:absolute; border-radius:3px; box-shadow:0 0 6px rgba(0,0,0,.25); }
.hint{color:var(--sub); font-size:1rem;}
.win{font-size:2rem; font-weight:800; color:var(--accent2);}
.err{color:var(--danger); font-size:.9rem; margin-top:10px; min-height:1.2em;}
#puzzle2-section{max-height:0; opacity:0; overflow:hidden; margin-top:0; transition:max-height .6s ease, opacity .6s ease, margin-top .6s ease;}
#puzzle2-section.visible{max-height:700px; opacity:1; margin-top:24px;}
.tetris-tray{display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin-bottom:18px;}
.tray-piece{position:relative; cursor:grab;}
.tray-block{position:absolute; background:#fff; border-radius:2px;}
.tetris-grid{display:grid; gap:2px; background:var(--panel2); padding:4px; border-radius:8px; margin:0 auto; width:max-content;}
.grid-cell{background:var(--panel); font-size:9px; color:var(--sub); padding:2px; border-radius:2px;}
.grid-cell.filled{background:#fff;}
.grid-cell.preview-valid{outline:3px solid var(--accent2); outline-offset:-3px;}
.grid-cell.preview-invalid{outline:3px solid var(--danger); outline-offset:-3px;}
.drag-ghost{position:fixed; pointer-events:none; z-index:999;}
.ghost-block{position:absolute; opacity:.85; border-radius:3px;}
#submit-btn{margin-top:18px;}
@keyframes shake{ 25%{transform:translateX(-6px);} 50%{transform:translateX(6px);} 75%{transform:translateX(-6px);} 100%{transform:translateX(0);} }
.tetris-grid.shake{animation:shake .6s ease-in-out;}
.grid-cell{transition:opacity .3s ease;}
.grid-cell.cell-hidden{opacity:0;}
@keyframes wrongClear{ 0%{background:var(--fill,#fff);} 30%{background:var(--danger); transform:scale(1);} 100%{background:var(--danger); transform:scale(.4); opacity:0;} }
.grid-cell.wrong-fade{background:var(--panel) !important; position:relative;}
.grid-cell.wrong-fade::after{content:''; position:absolute; inset:0; border-radius:2px; animation:wrongClear .6s ease-in forwards;}
@keyframes greenFlash{ 0%,50%,100%{background:var(--panel2); box-shadow:none;} 20%,70%{background:var(--accent2); box-shadow:0 0 22px 4px rgba(61,220,151,.7);} }
.tetris-grid.flash-green{animation:greenFlash 1s ease-in-out;}
#puzzle1-info{max-height:0; opacity:0; overflow:hidden; margin-top:0; transition:max-height .6s ease, opacity .6s ease, margin-top .6s ease;}
#puzzle1-info.visible{max-height:600px; opacity:1; margin-top:24px;}
.mini-grid{display:grid; gap:2px; background:var(--panel2); padding:4px; border-radius:8px; margin:0 auto; width:max-content;}
.mini-cell{width:20px; height:20px; background:var(--panel); border-radius:2px;}
.mini-cell.filled{background:#fff;}
.info-row{display:flex; gap:20px; justify-content:center; align-items:flex-start;}
.info-row .mini-grid{margin:0;}
#stage2-row{max-height:0; opacity:0; overflow:hidden; margin-top:0; transition:max-height .6s ease, opacity .6s ease, margin-top .6s ease;}
#stage2-row.visible{max-height:200px; opacity:1; margin-top:24px;}
#skip-btn{margin-top:20px; opacity:.6; font-size:.85rem; padding:10px 18px;}
.light-row{display:flex; align-items:center; justify-content:center;}
#puzzle3-section{max-height:0; opacity:0; overflow:hidden; margin-top:0; transition:max-height .6s ease, opacity .6s ease, margin-top .6s ease;}
#puzzle3-section.visible{max-height:400px; opacity:1; margin-top:24px;}
.maze-stage{width:380px; height:380px; max-width:100%; margin:0 auto; display:flex; align-items:center; justify-content:center;}
.maze{position:relative; width:264px; height:264px; background:var(--panel); flex:none;}
.maze .wall{position:absolute; background:var(--sub); border-radius:1px;}
.maze .exit-tile{position:absolute; width:44px; height:44px; background:rgba(61,220,151,.15); display:flex; align-items:center; justify-content:center;}
.maze .exit-tile i{width:28px; height:28px; border-radius:50%; background:#000; box-shadow:0 0 0 3px var(--accent2), 0 0 14px 2px rgba(61,220,151,.6);}
.maze .ball{position:absolute; width:16px; height:16px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#fff,var(--accent) 70%); box-shadow:0 2px 4px rgba(0,0,0,.4);}
#rotate-shelf{display:flex; gap:16px; justify-content:center; max-height:0; opacity:0; overflow:hidden; margin-top:0; transition:max-height .6s ease, opacity .6s ease, margin-top .6s ease;}
#rotate-shelf.visible{max-height:90px; opacity:1; margin-top:24px;}
.rot-btn{width:56px; height:56px; border-radius:50%; border:3px solid var(--panel2); background:var(--panel2); color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center;}
.rot-btn{touch-action:none; user-select:none; -webkit-user-select:none;}
.rot-btn:active{transform:scale(0.93);}
</style>
</head>
<body>

<div id="screen-choose" class="screen active">
  <div class="row" style="margin-top:20px;">
    <button class="role-btn" onclick="startHost()">Player 1<br><small>(hosts)</small></button>
    <button class="role-btn" onclick="showJoin()">Player 2<br><small>(joins)</small></button>
  </div>
  <div id="join-box" style="display:none; margin-top:20px;">
    <div><input id="code-in" class="code-input" maxlength="4" placeholder="CODE"></div>
    <button class="big-btn" onclick="startJoin()">Connect</button>
  </div>
  <div class="err" id="connect-err"></div>
</div>

<div id="screen-hosting" class="screen">
  <h1>Share this code</h1>
  <p class="sub">Tell Player 2 to enter it.</p>
  <div class="code-display" id="host-code">----</div>
  <p class="sub">Waiting for them to connect…</p>
</div>

<div id="screen-ready" class="screen">
  <button id="ready-btn" class="big-btn" onclick="pressReady()">Ready</button>
  <div id="waiting-text" class="waiting" style="display:none;">Waiting for other player…</div>
</div>

<div id="screen-countdown" class="screen">
  <div class="countdown-num" id="countdown-num">3</div>
</div>

<div id="screen-game1" class="screen">
  <div class="deco" id="pillars"></div>
  <div class="shelf" id="shelf"></div>
  <div id="rotate-shelf">
    <button class="rot-btn" onpointerdown="rotHold(-1)" onpointerup="rotRelease(-1)" onpointerleave="rotRelease(-1)" onpointercancel="rotRelease(-1)" oncontextmenu="return false" aria-label="Rotate counterclockwise"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
    <button class="rot-btn" onpointerdown="rotHold(1)" onpointerup="rotRelease(1)" onpointerleave="rotRelease(1)" onpointercancel="rotRelease(1)" oncontextmenu="return false" aria-label="Rotate clockwise"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></button>
  </div>
  <div id="puzzle1-info">
    <div class="info-row">
      <div class="mini-grid" id="heart-preview"></div>
      <div class="mini-grid" id="submit-preview-0"></div>
    </div>
    <div class="info-row" id="stage2-row">
      <div class="mini-grid" id="color-preview"></div>
      <div class="mini-grid" id="submit-preview-1"></div>
    </div>
  </div>
  <button id="skip-btn" class="big-btn" onclick="skipPuzzle1()">Skip to next puzzle (test)</button>
</div>

<div id="screen-game2" class="screen">
  <div class="light-row">
    <div class="light" id="light"></div>
  </div>
  <div class="hint">From shortest to tallest</div>
  <div id="puzzle2-section">
    <div class="tetris-tray" id="tetris-tray"></div>
    <div class="tetris-grid" id="tetris-grid"></div>
    <button class="big-btn" id="submit-btn" onclick="submitPattern()">Submit</button>
  </div>
  <div id="puzzle3-section"><div class="maze-stage"><div class="maze" id="maze"></div></div></div>
</div>

<div id="screen-win" class="screen">
  <div class="win">You win! 🎉</div>
</div>

<script>
const C = { red:'#ff5c72', orange:'#ffb347', yellow:'#ffe066', green:'#3ddc97', blue:'#5865f2' };
const PUZZLE = {
  buttonMap: [C.yellow, C.green, C.red, C.orange, C.blue],
  pillars: [
    {color:C.yellow, height:136},
    {color:C.blue,   height:72},
    {color:C.red,    height:168},
    {color:C.green,  height:40},
    {color:C.orange, height:104}
  ],
  order: [C.green, C.blue, C.orange, C.yellow, C.red]
};
const ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const TETROMINOES = {
  I: [[0,0],[0,1],[0,2],[0,3]],
  O: [[0,0],[0,1],[1,0],[1,1]],
  T: [[0,0],[0,1],[0,2],[1,1]],
  L: [[0,0],[1,0],[2,0],[2,1]],
  J: [[0,1],[1,1],[2,0],[2,1]],
  S: [[0,0],[1,0],[1,1],[2,1]],
  Z: [[0,1],[1,0],[1,1],[2,0]]
};

const HEART_PATTERN = [
  [false,true, false,true, false],
  [true, true, true, true, true ],
  [true, true, true, true, true ],
  [false,true, true, true, false],
  [false,false,true, false,false]
];
const COLOR_PATTERN = [
  [ 'orange','yellow','yellow','yellow','green' ],
  [ 'orange','orange','yellow','green', 'green' ],
  [ 'red',   'orange',null,    'green', 'blue'  ],
  [ 'red',   'white', 'white', 'white', 'blue'  ],
  [ 'red',   'red',   'white', 'blue',  'blue'  ]
];
const STAGE_PATTERNS = [HEART_PATTERN, COLOR_PATTERN];
function colorCategory(hex){
  if(hex === '#ffffff') return 'white';
  for(const k in C) if(C[k] === hex) return k;
  return null;
}
function patternHex(v){ return v === 'white' ? '#ffffff' : (v ? C[v] : ''); }
function patternMatches(target){
  for(let r = 0; r < gridSize; r++) for(let c = 0; c < gridSize; c++){
    const t = target[r][c];
    const v = boardState[r][c];
    if(typeof t === 'boolean'){ if(!!v !== t) return false; }
    else if((v ? colorCategory(v) : null) !== t) return false;
  }
  return true;
}

let peer = null, conn = null, myRole = null;
let ready = {1:false, 2:false};
let started = false;
let puzzle = null;
let progress = [];

const $ = id => document.getElementById(id);
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); $(id).classList.add('active'); }
function makeCode(){ return Array.from({length:4}, ()=>ALPHA[Math.floor(Math.random()*ALPHA.length)]).join(''); }

function startHost(){
  myRole = 1;
  show('screen-hosting');
  attemptHost();
}
function attemptHost(){
  const code = makeCode();
  if(peer) peer.destroy();
  peer = new Peer('2pesc-' + code);
  peer.on('open', () => { $('host-code').textContent = code; });
  peer.on('connection', c => { conn = c; wireConn(); });
  peer.on('error', err => {
    if(err.type === 'unavailable-id'){ attemptHost(); }
    else { $('connect-err').textContent = 'Connection error: ' + err.type; }
  });
}

function showJoin(){ $('join-box').style.display = 'block'; }
function startJoin(){
  const code = $('code-in').value.trim().toUpperCase();
  if(code.length !== 4){ $('connect-err').textContent = 'Enter the 4-character code.'; return; }
  myRole = 2;
  peer = new Peer();
  peer.on('open', () => {
    conn = peer.connect('2pesc-' + code);
    conn.on('open', () => wireConn());
    conn.on('error', () => { $('connect-err').textContent = 'Could not connect — check the code.'; });
  });
  peer.on('error', err => { $('connect-err').textContent = 'Connection error: ' + err.type; });
}

function wireConn(){
  conn.on('data', handleData);
  show('screen-ready');
}
function send(type, payload){ if(conn && conn.open) conn.send({type, payload}); }
function handleData(msg){
  if(msg.type === 'ready'){ ready[msg.payload.role] = true; updateWaiting(); tryStart(); }
  else if(msg.type === 'start'){ puzzle = msg.payload.puzzle; if(!started){ started = true; runCountdown(); } }
  else if(msg.type === 'press'){ if(myRole === 2 && !pieceOnLight) lightUp(msg.payload.color); }
  else if(msg.type === 'win'){ completePuzzle1(false); }
  else if(msg.type === 'stage2'){ revealColorPattern(); }
  else if(msg.type === 'submitted'){ renderSubmission(msg.payload.board, msg.payload.stage); }
  else if(msg.type === 'lightblock'){ setShelfBlocked(msg.payload.blocked); }
  else if(msg.type === 'skiptetris1'){ if(myRole === 2){ advanceToColorStage(); send('stage2', {}); } }
  else if(msg.type === 'rotate'){ if(myRole === 2 && mz) mz.dir = msg.payload.dir; }
  else if(msg.type === 'level3'){ if(myRole === 1) showRotateButtons(); else startLevel3(); }
  else if(msg.type === 'finalwin'){ show('screen-win'); }
}

function pressReady(){
  ready[myRole] = true;
  $('ready-btn').disabled = true;
  send('ready', {role: myRole});
  updateWaiting();
  tryStart();
}
function updateWaiting(){ $('waiting-text').style.display = (ready[myRole] && !(ready[1] && ready[2])) ? 'block' : 'none'; }
function tryStart(){
  if(started || !(ready[1] && ready[2])) return;
  if(myRole === 1){
    started = true;
    puzzle = PUZZLE;
    send('start', {puzzle});
    runCountdown();
  }
}

function runCountdown(){
  show('screen-countdown');
  const steps = ['3','2','1','Go!'];
  let i = 0;
  $('countdown-num').textContent = steps[i];
  const t = setInterval(() => {
    i++;
    if(i >= steps.length){ clearInterval(t); startGame(); return; }
    $('countdown-num').textContent = steps[i];
  }, 700);
}

function startGame(){
  if(myRole === 1){ renderPillars(); renderShelf(); show('screen-game1'); }
  else{ show('screen-game2'); }
}
function renderPillars(){
  const el = $('pillars'); el.innerHTML = '';
  puzzle.pillars.forEach(p => {
    const d = document.createElement('div');
    d.className = 'pillar'; d.style.height = p.height + 'px'; d.style.background = p.color;
    el.appendChild(d);
  });
}
function renderShelf(){
  const el = $('shelf'); el.innerHTML = '';
  puzzle.buttonMap.forEach((color, idx) => {
    const b = document.createElement('button');
    b.className = 'shelf-btn';
    b.onclick = () => pressButton(idx);
    el.appendChild(b);
  });
}
let shelfBlocked = false;
function setShelfBlocked(v){
  shelfBlocked = v;
  document.querySelectorAll('.shelf-btn').forEach(b => b.disabled = v);
}
function pressButton(idx){
  if(shelfBlocked) return;
  const color = puzzle.buttonMap[idx];
  send('press', {color});
  checkProgress(color);
}
function checkProgress(color){
  const next = progress.length;
  if(puzzle.order[next] === color){
    progress.push(color);
    if(progress.length === puzzle.order.length){ completePuzzle1(true); }
  }else{
    progress = (puzzle.order[0] === color) ? [color] : [];
  }
}
let currentLightColor = null;
let pieceOnLight = false;
function setPieceOnLight(v){ pieceOnLight = v; send('lightblock', {blocked: v}); }
function lightUp(color){ const l = $('light'); l.style.background = color; l.classList.add('lit'); currentLightColor = color; }

let p1Stage = 0; // 0 buttons, 1 heart tetris, 2 color tetris, 3 maze
function skipPuzzle1(){
  if(p1Stage === 0) completePuzzle1(true);
  else if(p1Stage === 1){ p1Stage = 2; send('skiptetris1', {}); }
  else if(p1Stage === 2){ send('level3', {}); showRotateButtons(); }
}
let holdDir = 0;
function rotHold(d){ holdDir = d; send('rotate', {dir: d}); }
function rotRelease(d){ if(holdDir === d){ holdDir = 0; send('rotate', {dir: 0}); } }
function showRotateButtons(){ p1Stage = 3; $('rotate-shelf').classList.add('visible'); $('skip-btn').style.display = 'none'; }
function completePuzzle1(broadcast){
  if(myRole === 1 && p1Stage < 1) p1Stage = 1;
  if(broadcast) send('win', {});
  revealHeart();
  unlockPuzzle2();
}
function revealHeart(){
  if(myRole !== 1) return;
  $('puzzle1-info').classList.add('visible');
}
function unlockPuzzle2(){
  if(myRole !== 2) return;
  $('puzzle2-section').classList.add('visible');
}
function revealColorPattern(){
  if(myRole !== 1) return;
  if(p1Stage < 2) p1Stage = 2;
  $('stage2-row').classList.add('visible');
}
function buildColorPreview(){
  const el = $('color-preview');
  el.style.gridTemplateColumns = `repeat(5, 20px)`;
  el.style.gridTemplateRows = `repeat(5, 20px)`;
  COLOR_PATTERN.forEach(row => row.forEach(v => {
    const d = document.createElement('div');
    d.className = 'mini-cell';
    d.style.background = patternHex(v);
    el.appendChild(d);
  }));
}
function buildSubmitPreview(){
  [0, 1].forEach(n => {
    const el = $('submit-preview-' + n);
    el.style.gridTemplateColumns = `repeat(5, 20px)`;
    el.style.gridTemplateRows = `repeat(5, 20px)`;
    for(let i = 0; i < 25; i++){
      const d = document.createElement('div');
      d.className = 'mini-cell';
      el.appendChild(d);
    }
  });
}
function renderSubmission(board, stage){
  if(myRole !== 1) return;
  const cells = $('submit-preview-' + stage).children;
  board.forEach((row, r) => row.forEach((v, c) => { cells[r * 5 + c].style.background = v || ''; }));
}
function buildHeartPreview(){
  const el = $('heart-preview');
  el.style.gridTemplateColumns = `repeat(5, 20px)`;
  el.style.gridTemplateRows = `repeat(5, 20px)`;
  HEART_PATTERN.forEach(row => row.forEach(v => {
    const d = document.createElement('div');
    d.className = 'mini-cell' + (v ? ' filled' : '');
    el.appendChild(d);
  }));
}

// --- Puzzle 2: tetris grid ---
const CELL = 52, TCELL = 16;
let gridSize = 5, stageIndex = 0;
let boardState = [];
let gridCellEls = [];
let dragState = null;
let previewCells = [];

function gridPixelSize(size){ return size * CELL + (size - 1) * 2 + 8; }

function buildGrid(size){
  gridSize = size;
  boardState = Array.from({length:size}, () => Array(size).fill(null));
  gridCellEls = [];
  const grid = $('tetris-grid');
  grid.innerHTML = '';
  grid.style.gridTemplateColumns = `repeat(${size}, ${CELL}px)`;
  grid.style.gridTemplateRows = `repeat(${size}, ${CELL}px)`;
  grid.style.width = gridPixelSize(size) + 'px';
  grid.style.height = gridPixelSize(size) + 'px';
  for(let r = 0; r < size; r++){
    const rowArr = [];
    for(let c = 0; c < size; c++){
      const cell = document.createElement('div');
      cell.className = 'grid-cell';
      grid.appendChild(cell);
      rowArr.push(cell);
    }
    gridCellEls.push(rowArr);
  }
}

function buildTray(){
  const tray = $('tetris-tray');
  Object.keys(TETROMINOES).forEach(key => {
    const offsets = TETROMINOES[key];
    const maxR = Math.max(...offsets.map(o => o[0]));
    const maxC = Math.max(...offsets.map(o => o[1]));
    const wrap = document.createElement('div');
    wrap.className = 'tray-piece';
    wrap.style.width = ((maxC + 1) * TCELL) + 'px';
    wrap.style.height = ((maxR + 1) * TCELL) + 'px';
    offsets.forEach(([r,c]) => {
      const b = document.createElement('div');
      b.className = 'tray-block';
      b.style.left = (c * TCELL) + 'px'; b.style.top = (r * TCELL) + 'px';
      b.style.width = TCELL + 'px'; b.style.height = TCELL + 'px';
      wrap.appendChild(b);
    });
    wrap.addEventListener('mousedown', e => beginDrag(e, offsets, '#ffffff', false));
    tray.appendChild(wrap);
  });
}

let boardLocked = false;
function beginDrag(e, offsets, color, fromCharged){
  e.preventDefault();
  if(boardLocked) return;
  const maxR = Math.max(...offsets.map(o => o[0]));
  const maxC = Math.max(...offsets.map(o => o[1]));
  const ghost = document.createElement('div');
  ghost.className = 'drag-ghost';
  ghost.style.width = ((maxC + 1) * CELL) + 'px';
  ghost.style.height = ((maxR + 1) * CELL) + 'px';
  offsets.forEach(([r,c]) => {
    const b = document.createElement('div');
    b.className = 'ghost-block';
    b.style.left = (c * CELL) + 'px'; b.style.top = (r * CELL) + 'px';
    b.style.width = CELL + 'px'; b.style.height = CELL + 'px';
    b.style.background = color;
    ghost.appendChild(b);
  });
  document.body.appendChild(ghost);
  dragState = {offsets, color, fromCharged, ghost};
  positionGhost(e.clientX, e.clientY);
  updatePreview(e.clientX, e.clientY, offsets);
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('mouseup', onDragUp);
}
function positionGhost(x, y){
  dragState.ghost.style.left = (x - CELL/2) + 'px';
  dragState.ghost.style.top = (y - CELL/2) + 'px';
}
function targetCells(x, y, offsets){
  const rect = $('tetris-grid').getBoundingClientRect();
  if(x < rect.left || x >= rect.right || y < rect.top || y >= rect.bottom) return null;
  const col0 = Math.floor((x - rect.left) / CELL);
  const row0 = Math.floor((y - rect.top) / CELL);
  return offsets.map(([r,c]) => [row0 + r, col0 + c]);
}
function clearPreview(){
  previewCells.forEach(([r,c]) => gridCellEls[r][c].classList.remove('preview-valid','preview-invalid'));
  previewCells = [];
}
function updatePreview(x, y, offsets){
  clearPreview();
  const cells = targetCells(x, y, offsets);
  if(!cells) return;
  const valid = cells.every(([r,c]) => r >= 0 && r < gridSize && c >= 0 && c < gridSize && !boardState[r][c]);
  cells.forEach(([r,c]) => {
    if(r >= 0 && r < gridSize && c >= 0 && c < gridSize){
      gridCellEls[r][c].classList.add(valid ? 'preview-valid' : 'preview-invalid');
      previewCells.push([r,c]);
    }
  });
}
function isOverLight(x, y){
  const light = $('light');
  const r = light.getBoundingClientRect();
  return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
}
function canColorAtLight(){
  return stageIndex === 1 && $('light').classList.contains('needs-color') && !!currentLightColor;
}
function onDragMove(e){
  positionGhost(e.clientX, e.clientY);
  updatePreview(e.clientX, e.clientY, dragState.offsets);
  if(!dragState.fromCharged && canColorAtLight()){
    $('light').classList.toggle('drag-hover', isOverLight(e.clientX, e.clientY));
  }
}
function onDragUp(e){
  document.removeEventListener('mousemove', onDragMove);
  document.removeEventListener('mouseup', onDragUp);
  $('light').classList.remove('drag-hover');
  if(!dragState.fromCharged && canColorAtLight() && isOverLight(e.clientX, e.clientY)){
    colorizeAtLight(dragState.ghost, dragState.offsets);
  } else {
    const ok = tryPlace(e.clientX, e.clientY, dragState.offsets, dragState.color);
    dragState.ghost.remove();
    if(dragState.fromCharged){
      if(ok) setPieceOnLight(false);
      else placeChargedPiece(dragState.offsets, dragState.color);
    }
  }
  clearPreview();
  dragState = null;
}
function colorizeAtLight(ghost, offsets){
  const light = $('light');
  const color = currentLightColor;
  setPieceOnLight(true);
  const lr = light.getBoundingClientRect();
  const gr = ghost.getBoundingClientRect();
  ghost.style.transition = 'left .35s ease, top .35s ease, transform .5s ease';
  ghost.style.left = (lr.left + lr.width/2 - gr.width/2) + 'px';
  ghost.style.top = (lr.top + lr.height/2 - gr.height/2) + 'px';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    ghost.style.transform = 'rotate(360deg)';
  }));
  setTimeout(() => {
    ghost.querySelectorAll('.ghost-block').forEach(b => b.style.background = color);
    light.style.background = '';
    light.classList.remove('lit');
    currentLightColor = null;
  }, 380);
  setTimeout(() => {
    ghost.remove();
    placeChargedPiece(offsets, color);
  }, 620);
}
function placeChargedPiece(offsets, color){
  chargedPiece = {offsets, color};
  setPieceOnLight(true);
  const light = $('light');
  const old = $('charged-piece');
  if(old) old.remove();
  const el = document.createElement('div');
  el.className = 'charged-piece';
  el.id = 'charged-piece';
  const maxR = Math.max(...offsets.map(o => o[0]));
  const maxC = Math.max(...offsets.map(o => o[1]));
  const CS = CELL;
  el.style.width = ((maxC + 1) * CS) + 'px';
  el.style.height = ((maxR + 1) * CS) + 'px';
  offsets.forEach(([r,c]) => {
    const b = document.createElement('div');
    b.className = 'charged-block';
    b.style.left = (c * CS) + 'px'; b.style.top = (r * CS) + 'px';
    b.style.width = CS + 'px'; b.style.height = CS + 'px';
    b.style.background = color;
    el.appendChild(b);
  });
  el.addEventListener('mousedown', e => {
    e.preventDefault();
    if(boardLocked) return;
    chargedPiece = null;
    el.remove();
    beginDrag(e, offsets, color, true);
  });
  light.appendChild(el);
}
function tryPlace(x, y, offsets, color){
  const cells = targetCells(x, y, offsets);
  if(!cells) return false;
  const valid = cells.every(([r,c]) => r >= 0 && r < gridSize && c >= 0 && c < gridSize && !boardState[r][c]);
  if(!valid) return false;
  cells.forEach(([r,c]) => { boardState[r][c] = color; gridCellEls[r][c].style.background = color; gridCellEls[r][c].classList.add('filled'); });
  return true;
}

function resetBoard(){
  for(let r = 0; r < gridSize; r++) for(let c = 0; c < gridSize; c++){
    boardState[r][c] = null;
    gridCellEls[r][c].style.background = '';
    gridCellEls[r][c].classList.remove('filled','wrong-fade');
  }
}
function shakeGrid(){
  const grid = $('tetris-grid');
  grid.classList.add('shake');
  setTimeout(() => grid.classList.remove('shake'), 600);
}
function advanceToColorStage(){
  if(stageIndex === 1) return;
  stageIndex = 1;
  resetBoard();
  $('light').classList.add('needs-color');
}
function submitPattern(){
  if(boardLocked) return;
  const stage = stageIndex;
  send('submitted', {board: boardState.map(r => r.slice()), stage});
  boardLocked = true;
  if(!patternMatches(STAGE_PATTERNS[stage])){
    shakeGrid();
    document.querySelectorAll('.grid-cell.filled').forEach(c => { c.style.setProperty('--fill', c.style.background); c.classList.add('wrong-fade'); });
    setTimeout(() => { resetBoard(); boardLocked = false; }, 700);
    return;
  }
  const grid = $('tetris-grid');
  grid.classList.add('flash-green');
  setTimeout(() => {
    grid.classList.remove('flash-green');
    if(stage === 0){
      advanceToColorStage();
      send('stage2', {});
    } else {
      send('level3', {});
      startLevel3();
    }
    boardLocked = false;
  }, 1050);
}

// --- Level 3: tilt maze (fixed layout: '#' = wall, cells sit at odd rows/cols; edit freely) ---
const MAZE = ["#############", "#   #       #", "### ### # ###", "# #   # #   #", "# ### ##### #", "#   #       #", "# ######### #", "#         # #", "# ### ##### #", "# # #       #", "# # #########", "#           #", "#############"];
const MAZE_EXIT = [5, 5]; // [row, col]
const MS = 44, MN = 6, MR = 8, MT = 4, DT = 1/120, MG = 800, RSPEED = 50; // RSPEED = degrees per second while a button is held
const mzExit = {x: MAZE_EXIT[1] * MS + MS/2, y: MAZE_EXIT[0] * MS + MS/2};
let mazeRects = [], mz = null, mzActive = false, mzStarted = false, mzLast = 0, mzAcc = 0, ballEl = null;
function mazeStep(s){
  s.a += (s.dir || 0) * RSPEED * DT;
  const r = s.a * Math.PI / 180;
  s.vx += MG * Math.sin(r) * DT; s.vy += MG * Math.cos(r) * DT;
  const k = 1 - 1.2 * DT; s.vx *= k; s.vy *= k;
  const sp = Math.hypot(s.vx, s.vy); if(sp > 400){ s.vx *= 400 / sp; s.vy *= 400 / sp; }
  s.x += s.vx * DT; s.y += s.vy * DT;
  for(const [x0,y0,x1,y1] of mazeRects){
    const cx = Math.max(x0, Math.min(s.x, x1)), cy = Math.max(y0, Math.min(s.y, y1));
    let dx = s.x - cx, dy = s.y - cy; const d2 = dx*dx + dy*dy;
    if(d2 < MR*MR && d2 > 0){
      const d = Math.sqrt(d2); dx /= d; dy /= d;
      s.x = cx + dx * MR; s.y = cy + dy * MR;
      const vn = s.vx * dx + s.vy * dy;
      if(vn < 0){ s.vx -= 1.3 * vn * dx; s.vy -= 1.3 * vn * dy; }
    }
  }
}
function buildMaze(){
  const h = MT / 2; mazeRects = [];
  for(let r = 0; r <= MN; r++) for(let c = 0; c < MN; c++) if(MAZE[2*r][2*c+1] === '#') mazeRects.push([c*MS-h, r*MS-h, (c+1)*MS+h, r*MS+h]);
  for(let r = 0; r < MN; r++) for(let c = 0; c <= MN; c++) if(MAZE[2*r+1][2*c] === '#') mazeRects.push([c*MS-h, r*MS-h, c*MS+h, (r+1)*MS+h]);
  const m = $('maze'); m.innerHTML = '';
  const ex = document.createElement('div'); ex.className = 'exit-tile';
  ex.style.left = (MAZE_EXIT[1] * MS) + 'px'; ex.style.top = (MAZE_EXIT[0] * MS) + 'px';
  ex.innerHTML = '<i></i>'; m.appendChild(ex);
  mazeRects.forEach(([x0,y0,x1,y1]) => {
    const w = document.createElement('div'); w.className = 'wall';
    w.style.cssText = `left:${x0}px;top:${y0}px;width:${x1-x0}px;height:${y1-y0}px`;
    m.appendChild(w);
  });
  ballEl = document.createElement('div'); ballEl.className = 'ball'; m.appendChild(ballEl);
  mz = {x:MS/2, y:MS/2, vx:0, vy:0, a:0, dir:0};
  drawMaze();
}
function drawMaze(){
  $('maze').style.transform = 'rotate(' + mz.a + 'deg)';
  ballEl.style.left = (mz.x - MR) + 'px'; ballEl.style.top = (mz.y - MR) + 'px';
}
function startLevel3(){
  if(mzStarted) return;
  mzStarted = true;
  buildMaze();
  $('puzzle3-section').classList.add('visible');
  setTimeout(() => {
    $('puzzle3-section').scrollIntoView({behavior:'smooth', block:'center'});
    mzActive = true; mzLast = performance.now(); mzAcc = 0; requestAnimationFrame(mazeLoop);
  }, 700);
}
function mazeLoop(now){
  if(!mzActive) return;
  mzAcc = Math.min(mzAcc + (now - mzLast) / 1000, .1); mzLast = now;
  while(mzAcc >= DT){
    mazeStep(mz); mzAcc -= DT;
    if(Math.abs(mz.x - mzExit.x) < MS/2 && Math.abs(mz.y - mzExit.y) < MS/2){ mazeWin(); return; }
  }
  drawMaze();
  requestAnimationFrame(mazeLoop);
}
function mazeWin(){
  mzActive = false;
  ballEl.style.transition = 'left .3s ease, top .3s ease, transform .5s ease';
  ballEl.style.left = (mzExit.x - MR) + 'px'; ballEl.style.top = (mzExit.y - MR) + 'px';
  ballEl.style.transform = 'scale(.1)';
  setTimeout(() => { send('finalwin', {}); show('screen-win'); }, 800);
}

let chargedPiece = null;
buildGrid(5);
buildTray();
buildHeartPreview();
buildColorPreview();
buildSubmitPreview();
</script>
