<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Two Player Escape Room</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{
  --bg:#12131a; --panel:#1c1e29; --panel2:#262838; --text:#f2f2f7; --sub:#9a9cb0;
  --accent:#5865f2; --accent2:#3ddc97; --danger:#ff5c72;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --bg:#f4f5fb; --panel:#fff; --panel2:#eceefb; --text:#1b1c24; --sub:#63647a; }
}
:root[data-theme="light"]{ --bg:#f4f5fb; --panel:#fff; --panel2:#eceefb; --text:#1b1c24; --sub:#63647a; }
*{box-sizing:border-box;}
html{height:100%;}
body{margin:0;
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  display:flex; align-items:center; justify-content:center; min-height:100%; padding:20px;
  padding-top:calc(56px + env(safe-area-inset-top,0px));
  padding-bottom:calc(56px + env(safe-area-inset-bottom,0px));
}
.screen{display:none; width:100%; max-width:520px; text-align:center;}
.screen.active{display:block;}
h1{font-size:1.5rem; margin:0 0 6px;}
p.sub{color:var(--sub); margin:0 0 24px;}
.row{display:flex; gap:14px; justify-content:center; flex-wrap:wrap;}
.role-btn{ flex:1 1 140px; max-width:200px; padding:28px 16px; border-radius:16px; border:2px solid var(--panel2); background:var(--panel); color:var(--text); font-size:1.1rem; font-weight:600; cursor:pointer; }
.role-btn:hover{border-color:var(--accent);}
.big-btn{ padding:14px 32px; border-radius:14px; border:none; background:var(--accent); color:#fff; font-size:1.1rem; font-weight:600; cursor:pointer; }
.big-btn:disabled{opacity:.5; cursor:default;}
input.code-input{ font-size:1.4rem; letter-spacing:.3em; text-align:center; text-transform:uppercase; padding:12px; width:160px; border-radius:10px; border:2px solid var(--panel2); background:var(--panel); color:var(--text); margin:0 10px 16px; }
.code-display{ font-size:2.2rem; font-weight:800; letter-spacing:.15em; background:var(--panel); border-radius:14px; padding:18px; margin:16px 0; }
.waiting{color:var(--sub); margin-top:16px;}
.countdown-num{font-size:5rem; font-weight:800;}
.deco{ display:flex; align-items:flex-end; justify-content:center; gap:14px; height:180px; margin:24px auto 8px; padding:0 10px; }
.pillar{width:34px; border-radius:6px 6px 0 0;}
.shelf{ display:flex; gap:16px; justify-content:center; background:var(--panel); border-radius:16px; padding:20px; margin-top:10px; }
.shelf-btn{ width:56px; height:56px; border-radius:50%; border:3px solid var(--panel2); background:var(--panel2); cursor:pointer; }
.shelf-btn:active{transform:scale(0.93);}
.shelf-btn:disabled{opacity:.35; cursor:not-allowed; transform:none;}
.light{ position:relative; width:160px; height:160px; border-radius:50%; margin:24px auto; background:#3a3c4c; box-shadow: inset 0 0 30px rgba(0,0,0,.3); transition:background .4s ease, box-shadow .4s ease; }
.light.needs-color.lit{ box-shadow: inset 0 0 30px rgba(0,0,0,.3), 0 0 0 4px rgba(255,255,255,.85), 0 0 26px 6px rgba(255,255,255,.55); }
.light.needs-color.lit.drag-hover{ box-shadow: inset 0 0 30px rgba(0,0,0,.3), 0 0 0 4px var(--accent2), 0 0 28px 8px rgba(61,220,151,.65); }
.charged-piece{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); cursor:grab; z-index:5; transition:transform .35s cubic-bezier(.3,.7,.3,1); }
.charged-block{ position:absolute; border-radius:3px; box-shadow:0 0 6px rgba(0,0,0,.25); }
.hint{color:var(--sub); font-size:1rem;}
.win{font-size:2rem; font-weight:800; color:var(--accent2);}
.err{color:var(--danger); font-size:.9rem; margin-top:10px; min-height:1.2em;}
.tetris-tray{display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin-bottom:18px;}
.tray-piece{position:relative; cursor:grab;}
.tray-block{position:absolute; background:#fff; border-radius:2px;}
.tetris-grid{display:grid; gap:2px; background:var(--panel2); padding:4px; border-radius:8px; margin:0 auto; width:max-content;}
.grid-cell{background:var(--panel); font-size:9px; color:var(--sub); padding:2px; border-radius:2px;}
.grid-cell.filled{background:#fff;}
.grid-cell.preview-valid{outline:3px solid var(--accent2); outline-offset:-3px;}
.grid-cell.preview-invalid{outline:3px solid var(--danger); outline-offset:-3px;}
.drag-ghost{position:fixed; pointer-events:none; z-index:999;}
.ghost-block{position:absolute; opacity:.85; border-radius:3px;}
#submit-btn{margin-top:18px;}
@keyframes shake{ 25%{transform:translateX(-6px);} 50%{transform:translateX(6px);} 75%{transform:translateX(-6px);} 100%{transform:translateX(0);} }
.tetris-grid.shake{animation:shake .6s ease-in-out;}
.grid-cell{transition:opacity .3s ease;}
.grid-cell.cell-hidden{opacity:0;}
@keyframes wrongClear{ 0%{background:var(--fill,#fff);} 30%{background:var(--danger); transform:scale(1);} 100%{background:var(--danger); transform:scale(.4); opacity:0;} }
.grid-cell.wrong-fade{background:var(--panel) !important; position:relative;}
.grid-cell.wrong-fade::after{content:''; position:absolute; inset:0; border-radius:2px; animation:wrongClear .6s ease-in forwards;}
@keyframes greenFlash{ 0%,50%,100%{background:var(--panel2); box-shadow:none;} 20%,70%{background:var(--accent2); box-shadow:0 0 22px 4px rgba(61,220,151,.7);} }
.tetris-grid.flash-green{animation:greenFlash 1s ease-in-out;}
.reveal{display:grid; grid-template-rows:0fr; opacity:0; margin-top:0; transition:grid-template-rows .5s ease, opacity .5s ease, margin-top .5s ease;}
.reveal.visible{grid-template-rows:1fr; opacity:1; margin-top:24px;}
.reveal-inner{min-height:0; overflow:hidden;}
.reveal.open > .reveal-inner{overflow:visible;}
.pad{display:flex; gap:16px; justify-content:center;}
.pad-btn{width:64px; height:64px;}
.pad-btn.held{background:var(--accent); border-color:var(--accent); color:#fff;}
#plat{position:relative; margin:0 auto; --t:52px; border-radius:12px; overflow:hidden; box-shadow:0 0 0 2px var(--panel2), 0 10px 30px rgba(0,0,0,.35); transition:height .8s ease;
  background-color:#151723;
  background-image:radial-gradient(ellipse 70% 60% at 50% 25%, rgba(88,101,242,.18), transparent 70%), linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
  background-size:100% 100%, var(--t) var(--t), var(--t) var(--t);}
#plat-inner{position:absolute; left:0; top:0; width:100%; height:100%; transition:opacity .5s ease;}
#plat-inner > div{position:absolute;}
#plat > div, #plat-blocks > div{position:absolute;}
#plat .pc{background:rgba(88,101,242,.07); box-shadow:inset 0 0 0 1px rgba(154,156,176,.18); border-radius:4px;}
#plat .pb{border-radius:3px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.28), inset 0 3px 0 rgba(255,255,255,.28);}
#plat .pledge{background-color:#24263b; box-shadow:inset -2px 0 0 rgba(255,255,255,.05);
  background-image:linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px), linear-gradient(180deg, rgba(88,101,242,.22), rgba(0,0,0,.28));
  background-size:var(--t) var(--t), var(--t) var(--t), 100% 100%;}
#plat .pledge::before{content:''; position:absolute; left:0; right:0; top:0; height:5px; background:linear-gradient(90deg,#5865f2,#8f99ff);}
#plat .pceil{background:linear-gradient(rgba(0,0,0,.5), transparent); pointer-events:none;}
@keyframes exitFlash{ 0%{filter:brightness(1);} 45%{filter:brightness(1.7); box-shadow:0 0 0 3px #b6ffd8, 0 0 34px 12px rgba(61,220,151,.95), inset 0 0 14px rgba(0,0,0,.35);} 100%{filter:brightness(1);} }
#plat .pexit .pdoor.enter{animation:exitFlash .8s ease-out both;}
#plat .pexit .pdoor{position:absolute; left:10%; right:10%; top:4%; bottom:0; border-radius:50% 50% 0 0 / 100% 100% 0 0; overflow:hidden;
  background:radial-gradient(ellipse at 50% 100%, #d9ffea 0%, #3ddc97 28%, #0d4a33 62%, #02100a 100%);
  box-shadow:0 0 0 3px #3ddc97, 0 0 16px 3px rgba(61,220,151,.65), inset 0 0 14px rgba(0,0,0,.55);
  animation:exitPulse 2.4s ease-in-out infinite;}
#plat .pexit .pdoor::before{content:''; position:absolute; left:50%; bottom:-10%; width:70%; height:130%; transform:translateX(-50%);
  background:linear-gradient(to top, rgba(255,255,255,.75), rgba(255,255,255,0)); border-radius:50% 50% 0 0 / 100% 100% 0 0; filter:blur(4px);
  animation:exitRise 2.4s ease-in-out infinite;}
@keyframes exitPulse{ 0%,100%{box-shadow:0 0 0 3px #3ddc97, 0 0 12px 2px rgba(61,220,151,.5), inset 0 0 14px rgba(0,0,0,.55);} 50%{box-shadow:0 0 0 3px #7dffc4, 0 0 24px 6px rgba(61,220,151,.85), inset 0 0 14px rgba(0,0,0,.55);} }
@keyframes exitRise{ 0%,100%{opacity:.45; transform:translateX(-50%) translateY(6%);} 50%{opacity:.95; transform:translateX(-50%) translateY(-4%);} }
#plat .pplayer.respawn{animation:pfRespawn .7s linear;}
@keyframes pfRespawn{ 0%{background:#ff5c72; opacity:0;} 20%{opacity:1;} 40%{opacity:.2;} 60%{opacity:1;} 80%{opacity:.4;} 100%{background:#fff; opacity:1;} }
#plat .pplayer{left:0; top:0; background:#fff; border-radius:4px; box-shadow:0 0 12px 2px rgba(255,255,255,.28), inset 0 -3px 0 rgba(0,0,0,.08); will-change:transform;}
#plat-blocks{position:absolute; left:0; top:0; width:100%; height:100%;}
.mini-grid{display:grid; gap:2px; background:var(--panel2); padding:4px; border-radius:8px; margin:0 auto; width:max-content;}
.mini-cell{width:20px; height:20px; background:var(--panel); border-radius:2px;}
.mini-cell.filled{background:#fff;}
.info-row{display:flex; gap:20px; justify-content:center; align-items:flex-start;}
.info-row .mini-grid{margin:0;}
#skip-btn{margin-top:20px; opacity:.6; font-size:.85rem; padding:10px 18px;}
.light-row{display:flex; align-items:center; justify-content:center;}
.maze-stage{width:380px; height:380px; max-width:100%; margin:0 auto; display:flex; align-items:center; justify-content:center;}
.maze{position:relative; width:264px; height:264px; background:var(--panel); flex:none;}
.maze .wall{position:absolute; background:var(--sub); border-radius:1px;}
.maze .exit-tile{position:absolute; width:44px; height:44px; display:flex; align-items:center; justify-content:center;}
.maze .exit-tile i{width:28px; height:28px; border-radius:50%; background:#000; box-shadow:0 0 0 3px var(--accent2), 0 0 14px 2px rgba(61,220,151,.6);}
.maze .ball{position:absolute; width:16px; height:16px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#fff,var(--ballc,#c9cad6) 70%); box-shadow:0 2px 4px rgba(0,0,0,.4);}
#rotate-shelf .reveal-inner > div{display:flex; gap:16px; justify-content:center;}
.rot-btn{width:56px; height:56px; border-radius:50%; border:3px solid var(--panel2); background:var(--panel2); color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center;}
.maze .spike-tile{position:absolute; width:44px; height:44px; pointer-events:none; opacity:0; transition:opacity .6s ease;}
.maze .spike-tile b{position:absolute; left:0; top:2px; width:44px; height:6px; clip-path:polygon(0 0,12.5% 100%,25% 0,37.5% 100%,50% 0,62.5% 100%,75% 0,87.5% 100%,100% 0);}
.rot-btn{touch-action:none; user-select:none; -webkit-user-select:none;}
.rot-btn:active{transform:scale(0.93);}
@keyframes rotGlow{ 0%,100%{box-shadow:0 0 0 3px rgba(61,220,151,.5), 0 0 10px 2px rgba(61,220,151,.35);} 50%{box-shadow:0 0 0 4px rgba(61,220,151,.95), 0 0 24px 8px rgba(61,220,151,.75);} }
#rotate-shelf .rot-btn.glow{border-color:var(--accent2); animation:rotGlow 1.3s ease-in-out infinite;}
</style>
</head>
<body>

<div id="screen-choose" class="screen active">
  <div class="row" style="margin-top:20px;">
    <button class="role-btn" onclick="startHost()">Player 1<br><small>(hosts)</small></button>
    <button class="role-btn" onclick="showJoin()">Player 2<br><small>(joins)</small></button>
  </div>
  <div id="join-box" style="display:none; margin-top:20px;">
    <div><input id="code-in" class="code-input" maxlength="4" placeholder="CODE"></div>
    <button class="big-btn" onclick="startJoin()">Connect</button>
  </div>
  <div class="err" id="connect-err"></div>
</div>

<div id="screen-hosting" class="screen">
  <h1>Share this code</h1>
  <p class="sub">Tell Player 2 to enter it.</p>
  <div class="code-display" id="host-code">----</div>
  <p class="sub">Waiting for them to connect…</p>
</div>

<div id="screen-ready" class="screen">
  <button id="ready-btn" class="big-btn" onclick="pressReady()">Ready</button>
  <div id="waiting-text" class="waiting" style="display:none;">Waiting for other player…</div>
</div>

<div id="screen-countdown" class="screen">
  <div class="countdown-num" id="countdown-num">3</div>
</div>

<div id="screen-game1" class="screen">
  <div class="deco" id="pillars"></div>
  <div class="shelf" id="shelf"></div>
  <div id="rotate-shelf" class="reveal"><div class="reveal-inner"><div>
    <button class="rot-btn" onpointerdown="rotHold(-1)" onpointerup="rotRelease(-1)" onpointerleave="rotRelease(-1)" onpointercancel="rotRelease(-1)" oncontextmenu="return false" aria-label="Rotate counterclockwise"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
    <button class="rot-btn" onpointerdown="rotHold(1)" onpointerup="rotRelease(1)" onpointerleave="rotRelease(1)" onpointercancel="rotRelease(1)" oncontextmenu="return false" aria-label="Rotate clockwise"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></button>
  </div></div></div>
  <div id="puzzle1-info" class="reveal"><div class="reveal-inner">
    <div class="info-row">
      <div class="mini-grid" id="heart-preview"></div>
      <div class="mini-grid" id="submit-preview-0"></div>
    </div>
    <div id="stage2-row" class="reveal"><div class="reveal-inner"><div class="info-row">
      <div class="mini-grid" id="color-preview"></div>
      <div class="mini-grid" id="submit-preview-1"></div>
    </div></div></div>
  </div></div>
  <div id="platformer-section" class="reveal"><div class="reveal-inner"><div id="plat"></div></div></div>
  <button id="skip-btn" class="big-btn" onclick="skipPuzzle1()">Skip to next puzzle (test)</button>
</div>

<div id="screen-game2" class="screen">
  <div class="light-row">
    <div class="light" id="light"></div>
  </div>
  <div class="hint">From shortest to tallest</div>
  <div id="puzzle2-section" class="reveal"><div class="reveal-inner">
    <div class="tetris-tray" id="tetris-tray"></div>
    <div class="tetris-grid" id="tetris-grid"></div>
    <button class="big-btn" id="submit-btn" onclick="submitPattern()">Submit</button>
  </div></div>
  <div id="controls-section" class="reveal"><div class="reveal-inner">
    <div class="pad">
      <button class="rot-btn pad-btn" id="pbtn-l" onpointerdown="btnHold('l')" onpointerup="btnRelease('l')" onpointerleave="btnRelease('l')" onpointercancel="btnRelease('l')" oncontextmenu="return false" aria-label="Left"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="rot-btn pad-btn" id="pbtn-u" onpointerdown="btnHold('u')" onpointerup="btnRelease('u')" onpointerleave="btnRelease('u')" onpointercancel="btnRelease('u')" oncontextmenu="return false" aria-label="Jump"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l7-7 7 7"/></svg></button>
      <button class="rot-btn pad-btn" id="pbtn-r" onpointerdown="btnHold('r')" onpointerup="btnRelease('r')" onpointerleave="btnRelease('r')" onpointercancel="btnRelease('r')" oncontextmenu="return false" aria-label="Right"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </div></div>
  <div id="puzzle3-section" class="reveal"><div class="reveal-inner"><div class="maze-stage"><div class="maze" id="maze"></div></div></div></div>
</div>

<div id="screen-win" class="screen">
  <div class="win">You win! 🎉</div>
</div>

<script>
const C = { red:'#ff5c72', orange:'#ffb347', yellow:'#ffe066', green:'#3ddc97', blue:'#5865f2' };
const PUZZLE = {
  buttonMap: [C.yellow, C.green, C.red, C.orange, C.blue],
  pillars: [
    {color:C.yellow, height:136},
    {color:C.blue,   height:72},
    {color:C.red,    height:168},
    {color:C.green,  height:40},
    {color:C.orange, height:104}
  ],
  order: [C.green, C.blue, C.orange, C.yellow, C.red]
};
const ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const TETROMINOES = {
  I: [[0,0],[0,1],[0,2],[0,3]],
  O: [[0,0],[0,1],[1,0],[1,1]],
  T: [[0,0],[0,1],[0,2],[1,1]],
  L: [[0,0],[1,0],[2,0],[2,1]],
  J: [[0,1],[1,1],[2,0],[2,1]],
  S: [[0,0],[1,0],[1,1],[2,1]],
  Z: [[0,1],[1,0],[1,1],[2,0]]
};

const HEART_PATTERN = [
  [false,true, false,true, false],
  [true, true, true, true, true ],
  [true, true, true, true, true ],
  [false,true, true, true, false],
  [false,false,true, false,false]
];
const COLOR_PATTERN = [
  [ 'orange','yellow','yellow','yellow','green' ],
  [ 'orange','orange','yellow','green', 'green' ],
  [ 'red',   'orange',null,    'green', 'blue'  ],
  [ 'red',   'white', 'white', 'white', 'blue'  ],
  [ 'red',   'red',   'white', 'blue',  'blue'  ]
];
const STAGE_PATTERNS = [HEART_PATTERN, COLOR_PATTERN];
function colorCategory(hex){
  if(hex === '#ffffff') return 'white';
  for(const k in C) if(C[k] === hex) return k;
  return null;
}
function patternHex(v){ return v === 'white' ? '#ffffff' : (v ? C[v] : ''); }
function patternMatches(target){
  for(let r = 0; r < gridSize; r++) for(let c = 0; c < gridSize; c++){
    const t = target[r][c];
    const v = boardState[r][c];
    if(typeof t === 'boolean'){ if(!!v !== t) return false; }
    else if((v ? colorCategory(v) : null) !== t) return false;
  }
  return true;
}

let peer = null, conn = null, myRole = null;
let ready = {1:false, 2:false};
let started = false;
let puzzle = null;
let progress = [];

const $ = id => document.getElementById(id);
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); $(id).classList.add('active'); }
function makeCode(){ return Array.from({length:4}, ()=>ALPHA[Math.floor(Math.random()*ALPHA.length)]).join(''); }

function startHost(){
  myRole = 1;
  show('screen-hosting');
  attemptHost();
}
function attemptHost(){
  const code = makeCode();
  if(peer) peer.destroy();
  peer = new Peer('2pesc-' + code);
  peer.on('open', () => { $('host-code').textContent = code; });
  peer.on('connection', c => { conn = c; wireConn(); });
  peer.on('error', err => {
    if(err.type === 'unavailable-id'){ attemptHost(); }
    else { $('connect-err').textContent = 'Connection error: ' + err.type; }
  });
}

function showJoin(){ $('join-box').style.display = 'block'; }
function startJoin(){
  const code = $('code-in').value.trim().toUpperCase();
  if(code.length !== 4){ $('connect-err').textContent = 'Enter the 4-character code.'; return; }
  myRole = 2;
  peer = new Peer();
  peer.on('open', () => {
    conn = peer.connect('2pesc-' + code);
    conn.on('open', () => wireConn());
    conn.on('error', () => { $('connect-err').textContent = 'Could not connect — check the code.'; });
  });
  peer.on('error', err => { $('connect-err').textContent = 'Connection error: ' + err.type; });
}

function wireConn(){
  conn.on('data', handleData);
  show('screen-ready');
}
function send(type, payload){ if(conn && conn.open) conn.send({type, payload}); }
function handleData(msg){
  if(msg.type === 'ready'){ ready[msg.payload.role] = true; updateWaiting(); tryStart(); }
  else if(msg.type === 'start'){ puzzle = msg.payload.puzzle; if(!started){ started = true; runCountdown(); } }
  else if(msg.type === 'press'){ if(myRole === 2){ if(mzLevel === 4) setBallColor(msg.payload.color); if(!pieceOnLight) lightUp(msg.payload.color); } }
  else if(msg.type === 'win'){ completePuzzle1(false); }
  else if(msg.type === 'stage2'){ revealColorPattern(); }
  else if(msg.type === 'submitted'){ renderSubmission(msg.payload.board, msg.payload.stage); }
  else if(msg.type === 'lightblock'){ setShelfBlocked(msg.payload.blocked); }
  else if(msg.type === 'skiptetris1'){ if(myRole === 2){ advanceToColorStage(); send('stage2', {}); } }
  else if(msg.type === 'rotate'){ if(myRole === 2){ mzDir = msg.payload.dir; if(mz && mzActive) mz.dir = mzDir; if(msg.payload.dir) rotateCharged(msg.payload.dir); } }
  else if(msg.type === 'rotglow'){ if(myRole === 1) applyRotGlow(msg.payload.on); }

// --- Puzzle 2: tetris grid ---
const CELL = 52, TCELL = 16;

let boardState = [];

let previewCells = [];
let pieceIdGrid = [], pieceCounter = 0, platMode = false;

function gridPixelSize(size){ return size * CELL + (size - 1) * 2 + 8; }

function buildGrid(size){

function buildTray(){
  const tray = $('tetris-tray');
  Object.keys(TETROMINOES).forEach(key => {
    const offsets = TETROMINOES[key];
    const maxR = Math.max(...offsets.map(o => o[0]));
    const maxC = Math.max(...offsets.map(o => o[1]));
    const wrap = document.createElement('div');
    wrap.className = 'tray-piece';
    wrap.style.width = ((maxC + 1) * TCELL) + 'px';
    wrap.style.height = ((maxR + 1) * TCELL) + 'px';

let boardLocked = false;
function beginDrag(e, offsets, color, fromCharged){
  e.preventDefault();
  if(boardLocked) return;
  const maxR = Math.max(...offsets.map(o => o[0]));
  const maxC = Math.max(...offsets.map(o => o[1]));
  const ghost = document.createElement('div');
  ghost.className = 'drag-ghost';
  ghost.style.width = ((maxC + 1) * CELL) + 'px';
  ghost.style.height = ((maxR + 1) * CELL) + 'px';
  offsets.forEach(([r,c]) => {
    const b = document.createElement('div');
    b.className = 'ghost-block';
    b.style.left = (c * CELL) + 'px'; b.style.top = (r * CELL) + 'px';
    b.style.width = CELL + 'px'; b.style.height = CELL + 'px';
    b.style.background = color;
    ghost.appendChild(b);
  });
  document.body.appendChild(ghost);
  dragState = {offsets, color, fromCharged, ghost};
  positionGhost(e.clientX, e.clientY);
  updatePreview(e.clientX, e.clientY, offsets);
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('mouseup', onDragUp);
}
function positionGhost(x, y){
  dragState.ghost.style.left = (x - CELL/2) + 'px';
  dragState.ghost.style.top = (y - CELL/2) + 'px';
}
function targetCells(x, y, offsets){
  const rect = $('tetris-grid').getBoundingClientRect();
  if(x < rect.left || x >= rect.right || y < rect.top || y >= rect.bottom) return null;
  const col0 = Math.floor((x - rect.left) / CELL);
  const row0 = Math.floor((y - rect.top) / CELL);
  return offsets.map(([r,c]) => [row0 + r, col0 + c]);
}
function clearPreview(){
  previewCells.forEach(([r,c]) => gridCellEls[r][c].classList.remove('preview-valid','preview-invalid'));
  previewCells = [];
}
function updatePreview(x, y, offsets){
  clearPreview();
  const cells = targetCells(x, y, offsets);
  if(!cells) return;
  const valid = cells.every(([r,c]) => r >= 0 && r < gridSize && c >= 0 && c < gridSize && !boardState[r][c]);
  cells.forEach(([r,c]) => {
    if(r >= 0 && r < gridSize && c >= 0 && c < gridSize){
      gridCellEls[r][c].classList.add(valid ? 'preview-valid' : 'preview-invalid');
      previewCells.push([r,c]);
    }
  });
}
function isOverLight(x, y){
  const light = $('light');
  const r = light.getBoundingClientRect();
  return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
}
function canColorAtLight(){
  return stageIndex === 1 && $('light').classList.contains('needs-color') && !!currentLightColor;
}
function onDragMove(e){
  positionGhost(e.clientX, e.clientY);
  updatePreview(e.clientX, e.clientY, dragState.offsets);
  if(!dragState.fromCharged && canColorAtLight()){
    $('light').classList.toggle('drag-hover', isOverLight(e.clientX, e.clientY));
  }
}
function onDragUp(e){
  document.removeEventListener('mousemove', onDragMove);
  document.removeEventListener('mouseup', onDragUp);
  $('light').classList.remove('drag-hover');
  if(!dragState.fromCharged && canColorAtLight() && isOverLight(e.clientX, e.clientY)){
    colorizeAtLight(dragState.ghost, dragState.offsets);
  } else {
    const ok = tryPlace(e.clientX, e.clientY, dragState.offsets, dragState.color);
    dragState.ghost.remove();
    if(dragState.fromCharged){
      if(ok) setPieceOnLight(false);
      else placeChargedPiece(dragState.offsets, dragState.color);
    }
  }
  clearPreview();
  dragState = null;
}
function colorizeAtLight(ghost, offsets){
  const light = $('light');
  const color = currentLightColor;
  setPieceOnLight(true);
  const lr = light.getBoundingClientRect();
  const gr = ghost.getBoundingClientRect();
  ghost.style.transition = 'left .35s ease, top .35s ease, transform .5s ease';
  ghost.style.left = (lr.left + lr.width/2 - gr.width/2) + 'px';
  ghost.style.top = (lr.top + lr.height/2 - gr.height/2) + 'px';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    ghost.style.transform = 'rotate(360deg)';
  }));
  setTimeout(() => {
    ghost.querySelectorAll('.ghost-block').forEach(b => b.style.background = color);
    light.style.background = '';
    light.classList.remove('lit');
    currentLightColor = null;
  }, 380);
  setTimeout(() => {
    ghost.remove();
    placeChargedPiece(offsets, color);
  }, 620);
}
let chargedAngle = 0;
function sendRotGlow(on){ send('rotglow', {on}); }
function applyRotGlow(on){ document.querySelectorAll('#rotate-shelf .rot-btn').forEach(b => b.classList.toggle('glow', !!on)); }
// 90 degree turn of a cell list (dir > 0 clockwise); result stays normalised to start at row/col 0
function rotateOffsets(offsets, dir){
  const maxR = Math.max(...offsets.map(o => o[0])), maxC = Math.max(...offsets.map(o => o[1]));
  return offsets.map(([r,c]) => dir > 0 ? [c, maxR - r] : [maxC - c, r]);
}
// The element keeps its original layout and just turns (accumulated angle), so it visibly spins, square piece included;
// the logical offsets are updated immediately so grabbing it mid-turn already uses the new shape.
function rotateCharged(dir){
  if(!chargedPiece || dragState) return;
  const el = $('charged-piece'); if(!el) return;
  chargedPiece.offsets = rotateOffsets(chargedPiece.offsets, dir);
  chargedAngle += 90 * dir;
  el.style.transform = `translate(-50%,-50%) rotate(${chargedAngle}deg)`;
}
function placeChargedPiece(offsets, color){
  chargedPiece = {offsets, color}; chargedAngle = 0;
  setPieceOnLight(true);
  const light = $('light');
  const old = $('charged-piece');
  if(old) old.remove();
  const el = document.createElement('div');
  el.className = 'charged-piece';
  el.id = 'charged-piece';
  const maxR = Math.max(...offsets.map(o => o[0]));
  const maxC = Math.max(...offsets.map(o => o[1]));
  const CS = CELL;
  el.style.width = ((maxC + 1) * CS) + 'px';
  el.style.height = ((maxR + 1) * CS) + 'px';
  offsets.forEach(([r,c]) => {
    const b = document.createElement('div');
    b.className = 'charged-block';
    b.style.left = (c * CS) + 'px'; b.style.top = (r * CS) + 'px';
    b.style.width = CS + 'px'; b.style.height = CS + 'px';
    b.style.background = color;
    el.appendChild(b);
  });
  el.addEventListener('mousedown', e => {
    e.preventDefault();
    if(boardLocked) return;
    const cur = chargedPiece ? chargedPiece.offsets : offsets;
    chargedPiece = null;
    el.remove();
    sendRotGlow(false);
    beginDrag(e, cur, color, true);
  });
  light.appendChild(el);
  sendRotGlow(true);
}
function tryPlace(x, y, offsets, color){
  const cells = targetCells(x, y, offsets);
  if(!cells) return false;
  const valid = cells.every(([r,c]) => r >= 0 && r < gridSize && c >= 0 && c < gridSize && !boardState[r][c]);
  if(!valid) return false;
  const id = ++pieceCounter;
  cells.forEach(([r,c]) => { boardState[r][c] = color; pieceIdGrid[r][c] = id; gridCellEls[r][c].style.background = color; gridCellEls[r][c].classList.add('filled'); });
  sendBoard();
  return true;
}

function resetBoard(){
  for(let r = 0; r < gridSize; r++) for(let c = 0; c < gridSize; c++){
    boardState[r][c] = null; pieceIdGrid[r][c] = 0;
    gridCellEls[r][c].style.background = '';
    gridCellEls[r][c].classList.remove('filled','wrong-fade');
  }
  sendBoard();
}
function sendBoard(){ if(platMode) send('board', {board: boardState.map(r => r.slice())}); }
function shakeGrid(){
  const grid = $('tetris-grid');
  grid.classList.add('shake');
  setTimeout(() => grid.classList.remove('shake'), 600);
}
function advanceToColorStage(){
  if(stageIndex === 1) return;
  stageIndex = 1;
  resetBoard();
  $('light').classList.add('needs-color');
}
function submitPattern(){
  if(boardLocked) return;
  if(platMode){ resetBoard(); return; } // platformer level: Submit clears the whole path at once
  const stage = stageIndex;
  send('submitted', {board: boardState.map(r => r.slice()), stage});
  boardLocked = true;
  if(!patternMatches(STAGE_PATTERNS[stage])){
    shakeGrid();
    document.querySelectorAll('.grid-cell.filled').forEach(c => { c.style.setProperty('--fill', c.style.background); c.classList.add('wrong-fade'); });
    setTimeout(() => { resetBoard(); boardLocked = false; }, 700);
    return;
  }
  const grid = $('tetris-grid');
  grid.classList.add('flash-green');
  setTimeout(() => {
    grid.classList.remove('flash-green');
    if(stage === 0){
      advanceToColorStage();
      send('stage2', {});
    } else {
      send('level3', {});
      startLevel3();
    }
    boardLocked = false;
  }, 1050);
}

// --- Level 3: tilt maze (fixed layout: '#' = wall, cells sit at odd rows/cols; edit freely) ---
const MAZE = ["#############", "#   #       #", "### ### # ###", "# #   # #   #", "# ### ##### #", "#   #       #", "# ######### #", "#         # #", "# ### ##### #", "# # #       #", "# # #########", "#           #", "#############"];
const MAZE_EXIT = [5, 5]; // [row, col]
const MS = 44, MN = 6, MR = 8, MT = 4, DT = 1/120, MG = 800, RSPEED = 50; // RSPEED = degrees per second while a button is held
const mzExit = {x: MAZE_EXIT[1] * MS + MS/2, y: MAZE_EXIT[0] * MS + MS/2};
let mazeRects = [], mz = null, mzActive = false, mzStarted = false, mzLast = 0, mzAcc = 0, ballEl = null;
function mazeStep(s){
  s.a += (s.dir || 0) * RSPEED * DT;
  const r = s.a * Math.PI / 180;
  s.vx += MG * Math.sin(r) * DT; s.vy += MG * Math.cos(r) * DT;
  const k = 1 - 1.2 * DT; s.vx *= k; s.vy *= k;
  const sp = Math.hypot(s.vx, s.vy); if(sp > 400){ s.vx *= 400 / sp; s.vy *= 400 / sp; }
  s.x += s.vx * DT; s.y += s.vy * DT;
  for(const [x0,y0,x1,y1] of mazeRects){
    const cx = Math.max(x0, Math.min(s.x, x1)), cy = Math.max(y0, Math.min(s.y, y1));
    let dx = s.x - cx, dy = s.y - cy; const d2 = dx*dx + dy*dy;
    if(d2 < MR*MR && d2 > 0){
      const d = Math.sqrt(d2); dx /= d; dy /= d;
      s.x = cx + dx * MR; s.y = cy + dy * MR;
      const vn = s.vx * dx + s.vy * dy;
      if(vn < 0){ s.vx -= 1.3 * vn * dx; s.vy -= 1.3 * vn * dy; }
    }
  }
}
function buildMaze(){
  const h = MT / 2; mazeRects = [];
  for(let r = 0; r <= MN; r++) for(let c = 0; c < MN; c++) if(MAZE[2*r][2*c+1] === '#') mazeRects.push([c*MS-h, r*MS-h, (c+1)*MS+h, r*MS+h]);
  for(let r = 0; r < MN; r++) for(let c = 0; c <= MN; c++) if(MAZE[2*r+1][2*c] === '#') mazeRects.push([c*MS-h, r*MS-h, c*MS+h, (r+1)*MS+h]);
  const m = $('maze'); m.innerHTML = '';
  const ex = document.createElement('div'); ex.className = 'exit-tile';
  ex.style.left = (MAZE_EXIT[1] * MS) + 'px'; ex.style.top = (MAZE_EXIT[0] * MS) + 'px';
  ex.innerHTML = '<i></i>'; m.appendChild(ex);
  mazeRects.forEach(([x0,y0,x1,y1]) => {
    const w = document.createElement('div'); w.className = 'wall';
    w.style.cssText = `left:${x0}px;top:${y0}px;width:${x1-x0}px;height:${y1-y0}px`;
    m.appendChild(w);
  });
  ballEl = document.createElement('div'); ballEl.className = 'ball'; m.appendChild(ballEl);
  mz = {x:MS/2, y:MS/2, vx:0, vy:0, a:0, dir:0};
  drawMaze();
}
function drawMaze(){
  $('maze').style.transform = 'rotate(' + mz.a + 'deg)';
  ballEl.style.left = (mz.x - MR) + 'px'; ballEl.style.top = (mz.y - MR) + 'px';
}
let mzLevel = 3, mzDir = 0, mzLoopId = 0, spikeList = [], ballColor = null;
// Spikes sit on a wall face of tile [row, col]; side = N/E/S/W. Ball must match the color to touch them.
const SPIKES = [
  [1,1,'S',C.green], [2,3,'S',C.red], [2,5,'E',C.yellow], [4,5,'S',C.blue], [4,3,'S',C.orange],
  [4,2,'W',C.red], [3,1,'N',C.yellow], [1,0,'W',C.green], [5,0,'S',C.blue], [5,2,'N',C.red],
  [5,3,'S',C.yellow], [5,4,'N',C.green],
  [0,2,'N',C.red], [0,3,'N',C.blue], [0,4,'N',C.orange], [0,5,'E',C.green]
];
const SPIKE_H = 6;
function spikeRect(r, c, side){
  const x0 = c*MS, y0 = r*MS, x1 = x0 + MS, y1 = y0 + MS, h = MT/2;
  return side === 'N' ? [x0, y0+h, x1, y0+h+SPIKE_H] : side === 'S' ? [x0, y1-h-SPIKE_H, x1, y1-h]
       : side === 'W' ? [x0+h, y0, x0+h+SPIKE_H, y1] : [x1-h-SPIKE_H, y0, x1-h, y1];
}
function setBallColor(col){ ballColor = col; if(ballEl) ballEl.style.setProperty('--ballc', col); }
function spikeHit(){
  for(const sp of spikeList){
    if(sp.color === ballColor) continue;
    const [x0,y0,x1,y1] = sp.rect;
    const cx = Math.max(x0, Math.min(mz.x, x1)), cy = Math.max(y0, Math.min(mz.y, y1));
    if(Math.hypot(mz.x - cx, mz.y - cy) < MR + 1) return true;
  }
  return false;
}
function startLevel3(){
  if(mzStarted) return;
  mzStarted = true;
  buildMaze();
  $('puzzle3-section').classList.add('visible');
  setTimeout(() => {
    $('puzzle3-section').scrollIntoView({behavior:'smooth', block:'center'});
    startMazeLoop();
  }, 700);
}
function startLevel4(){
  if(mzLevel === 4) return;
  if(!mzStarted) startLevel3();
  mzLevel = 4;
  const m = $('maze'), rot = {N:0, E:90, S:180, W:270};
  SPIKES.forEach(([r,c,side,col]) => {
    spikeList.push({rect: spikeRect(r,c,side), color: col});
    const t = document.createElement('div'); t.className = 'spike-tile';
    t.style.cssText = `left:${c*MS}px;top:${r*MS}px;transform:rotate(${rot[side]}deg)`;
    t.innerHTML = `<b style="background:${col}"></b>`;
    m.insertBefore(t, ballEl);
    setTimeout(() => t.style.opacity = 1, 30);
  });
  mazeReset();
}
function startMazeLoop(){
  const id = ++mzLoopId;
  mzActive = true; mzLast = performance.now(); mzAcc = 0; mz.dir = mzDir;
  const f = now => {
    if(!mzActive || id !== mzLoopId) return;
    mzAcc = Math.min(mzAcc + (now - mzLast) / 1000, .1); mzLast = now;
    while(mzAcc >= DT){
      mazeStep(mz); mzAcc -= DT;
      if(Math.abs(mz.x - mzExit.x) < MS/2 && Math.abs(mz.y - mzExit.y) < MS/2){ mazeWin(); return; }
      if(mzLevel === 4 && spikeHit()){ mazeDie(); return; }
    }
    drawMaze();
    requestAnimationFrame(f);
  };
  requestAnimationFrame(f);
}
// Animated return to the start: maze spins back to 0, ball pops out and reappears at the start
function mazeReset(){
  mzActive = false; mzLoopId++;
  const m = $('maze');
  m.style.transition = 'transform .8s ease'; m.style.transform = 'rotate(0deg)';
  ballEl.style.transition = 'transform .25s ease, opacity .25s ease'; ballEl.style.opacity = '0';
  setTimeout(() => {
    if(platMode) return;
    mz = {x:MS/2, y:MS/2, vx:0, vy:0, a:0, dir:0};
    ballEl.style.transition = 'none'; ballEl.style.transform = 'scale(0)'; drawMaze();
    requestAnimationFrame(() => requestAnimationFrame(() => {
      ballEl.style.transition = 'transform .3s ease, opacity .3s ease';
      ballEl.style.opacity = '1'; ballEl.style.transform = 'scale(1)';
    }));
  }, 450);
  setTimeout(() => { m.style.transition = ''; if(!platMode) startMazeLoop(); }, 850);
}
function mazeDie(){
  ballEl.style.transition = 'transform .25s ease'; ballEl.style.transform = 'scale(1.8)';
  mazeReset();
}
function mazeWin(){
  mzActive = false;
  ballEl.style.transition = 'left .3s ease, top .3s ease, transform .5s ease';
  ballEl.style.left = (mzExit.x - MR) + 'px'; ballEl.style.top = (mzExit.y - MR) + 'px';
  ballEl.style.transform = 'scale(.1)';
  setTimeout(() => {
    if(mzLevel === 3){ send('level4', {}); startLevel4(); }
    else { send('level5', {}); startLevel5(); }
  }, 800);
}

// --- Level 5: platformer (simulated on Player 1's screen, driven by Player 2's controls) ---
// Arena is 10 tiles wide, floor at the bottom. Tetris grid(s) = right 5x5 block(s) (cols 5-9, starting at row PF_OY); fixed ledge = cols 0-4, top at row PF_OY-1 (2 tiles of headroom above it).
const PF_N = 10, PF_OY = 3, PF_S = 0.8, PF_G = 30, PF_SPEED = 4, PF_DT = 1/120, PF_EPS = 1e-6;
const PF_JUMP = Math.sqrt(2 * PF_G * 1.2) + PF_G * PF_DT / 2; // 1.2 tiles high
// Level 1 climbs one 5x5 grid (arena 8 tall); level 2 climbs two identical grids stacked into 5x10 (arena 13 tall).
// The ledge is centred over the left half and reaches down until only 2 tiles of headroom are left above the floor; the exit is centred on it.
let pfLevel = 1, pfH = 8, pfLedge = [0,2,5,6], pfExit = [1.5,1,3.5,2], pfTrans = false, pfFloorH = 12;
function pfSetLevel(n){ pfLevel = n; pfH = n === 1 ? 8 : 13; pfLedge = [0, 2, 5, pfH - 2]; pfExit = [1.5, 1, 3.5, 2]; }
let pf = null, pfIn = {l:0,r:0,u:0}, pfBoard = null, pfSolid = [pfLedge];
let pfStarted = false, pfActive = false, pfT = 50, pfEl = null, pfLoopId = 0, pfLast = 0, pfAcc = 0;
function pfOverlaps(x, y, r){ return x < r[2]-PF_EPS && x+PF_S > r[0]+PF_EPS && y < r[3]-PF_EPS && y+PF_S > r[1]+PF_EPS; }
function pfMk(cls, x, y, w, h, parent){
  const d = document.createElement('div'); d.className = cls;
  d.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
  (parent || $('plat-inner')).appendChild(d); return d;
}
function pfComputeSolid(){
  pfSolid = [pfLedge];
  (pfBoard || []).forEach((row, r) => row.forEach((v, c) => { if(v) for(let g = 0; g < pfLevel; g++) pfSolid.push([5+c, PF_OY+g*5+r, 6+c, PF_OY+g*5+r+1]); }));
}
function pfDrawBlocks(){
  const bl = $('plat-blocks'); if(!bl) return;
  bl.innerHTML = '';
  (pfBoard || []).forEach((row, r) => row.forEach((v, c) => {
    if(v) for(let g = 0; g < pfLevel; g++) pfMk('pb', (5+c)*pfT, (PF_OY+g*5+r)*pfT, pfT, pfT, bl).style.background = v;
  }));
}
function pfSetBoard(board){
  pfBoard = board; pfComputeSolid();
  if(!pf) return;
  pfDrawBlocks();
  if(pfSolid.some(r => pfOverlaps(pf.x, pf.y, r))) pfRespawn(); // a block landed on the player: kill and send back to the start
}
function pfRespawn(){
  pf.x = 2.1; pf.y = pfH - PF_S; pf.vx = 0; pf.vy = 0; pf.grounded = true;
  pfDraw();
  pfEl.classList.remove('respawn'); void pfEl.offsetWidth; pfEl.classList.add('respawn');
}
// (Re)draws everything inside the arena for the current pfLevel
function pfBuildScene(){
  const T = pfT, inner = $('plat-inner'); inner.innerHTML = '';
  for(let g = 0; g < pfLevel; g++) for(let r = 0; r < 5; r++) for(let c = 0; c < 5; c++) pfMk('pc', (5+c)*T+2, (PF_OY+g*5+r)*T+2, T-4, T-4);
  const bl = document.createElement('div'); bl.id = 'plat-blocks'; inner.appendChild(bl);
  pfMk('pledge', pfLedge[0]*T, pfLedge[1]*T, (pfLedge[2]-pfLedge[0])*T, (pfLedge[3]-pfLedge[1])*T);
  const ex = pfMk('pexit', pfExit[0]*T, pfExit[1]*T, (pfExit[2]-pfExit[0])*T, (pfExit[3]-pfExit[1])*T);
  ex.innerHTML = '<div class="pdoor"></div>';
  pfMk('pledge pfloor', 0, pfH*T, PF_N*T, pfFloorH);
  pfMk('pceil', 0, 0, PF_N*T, T*.6);
  pfEl = pfMk('pplayer', 0, 0, PF_S*T, PF_S*T);
  pfEl.innerHTML = '<svg viewBox="0 0 24 24" width="100%" height="100%"><circle cx="8.5" cy="9" r="1.9" fill="#000"/><circle cx="15.5" cy="9" r="1.9" fill="#000"/><path d="M6.5 14.5Q12 20.5 17.5 14.5" fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round"/></svg>';
  pf = {x:2.1, y:pfH - PF_S, vx:0, vy:0, grounded:true};
  pfComputeSolid(); pfDrawBlocks(); pfDraw();
}
function buildPlatformer(){
  pfT = Math.max(24, Math.floor(Math.min(520, $('screen-game1').clientWidth) / PF_N));
  pfSetLevel(1);
  const el = $('plat'); el.innerHTML = '<div id="plat-inner"></div>';
  pfFloorH = Math.max(10, Math.round(pfT * .22));
  el.style.setProperty('--t', pfT + 'px');
  el.style.width = (PF_N * pfT) + 'px'; el.style.height = (pfH * pfT + pfFloorH) + 'px';
  pfBuildScene();
}
// Level 1 -> 2: fade the level out, grow the arena by 5 tiles, fade the taller level in
function pfNextLevel(){
  if(pfLevel !== 1 || pfTrans || !pfStarted) return;
  pfTrans = true; pfActive = false; pfLoopId++;
  $('skip-btn').style.display = 'none';
  send('level6', {});
  const el = $('plat'), inner = $('plat-inner');
  inner.style.opacity = '0';
  setTimeout(() => { el.style.height = ((pfH + 5) * pfT + pfFloorH) + 'px'; }, 550);
  setTimeout(() => {
    pfSetLevel(2); p1Stage = 6;
    pfBuildScene();
    void inner.offsetWidth; inner.style.opacity = '1';
    $('platformer-section').scrollIntoView({behavior:'smooth', block:'center'});
  }, 1450);
  setTimeout(() => { pfTrans = false; pfLoop(); }, 2050);
}
function pfDraw(){ pfEl.style.transform = `translate(${pf.x * pfT}px,${pf.y * pfT}px)`; }
function pfStep(){
  const s = pf;
  s.vx = (pfIn.r - pfIn.l) * PF_SPEED;
  if(pfIn.u && s.grounded) s.vy = -PF_JUMP;
  s.vy = Math.min(s.vy + PF_G * PF_DT, 25);
  s.x = Math.max(0, Math.min(PF_N - PF_S, s.x + s.vx * PF_DT));
  for(const r of pfSolid) if(pfOverlaps(s.x, s.y, r)){
    if(s.vx > 0) s.x = r[0] - PF_S; else if(s.vx < 0) s.x = r[2];
  }
  s.y += s.vy * PF_DT; s.grounded = false;
  if(s.y < 0){ s.y = 0; if(s.vy < 0) s.vy = 0; }
  for(const r of pfSolid) if(pfOverlaps(s.x, s.y, r)){
    if(s.vy > 0){ s.y = r[1] - PF_S; s.grounded = true; } else if(s.vy < 0){ s.y = r[3]; }
    s.vy = 0;
  }
  if(s.y >= pfH - PF_S){ s.y = pfH - PF_S; s.vy = 0; s.grounded = true; }
}
function pfLoop(){
  const id = ++pfLoopId; pfActive = true; pfLast = performance.now(); pfAcc = 0;
  const f = now => {
    if(!pfActive || id !== pfLoopId) return;
    pfAcc = Math.min(pfAcc + (now - pfLast) / 1000, .1); pfLast = now;
    while(pfAcc >= PF_DT){
      pfStep(); pfAcc -= PF_DT;
      if(pfInExit()){ pfWin(); return; }
    }
    pfDraw();
    requestAnimationFrame(f);
  };
  requestAnimationFrame(f);
}
// The cube has to be properly inside the doorway (centre well within it), not just touching it
function pfInExit(){
  const cx = pf.x + PF_S/2, cy = pf.y + PF_S/2;
  return cx > pfExit[0] + .3 && cx < pfExit[2] - .3 && cy > pfExit[1] && cy < pfExit[3];
}
// Cube slides to the middle of the doorway, then shrinks and spins into it while the door flashes
function pfEnterExit(done){
  const T = pfT, sz = PF_S * T;
  const tx = (pfExit[0] + pfExit[2]) / 2 * T - sz/2;
  const ty = (pfExit[1] + (pfExit[3] - pfExit[1]) * .58) * T - sz/2;
  const door = document.querySelector('#plat .pdoor');
  pfEl.style.transition = 'transform .3s ease-out';
  pfEl.style.transform = `translate(${tx}px,${pf.y * T}px)`;
  setTimeout(() => {
    if(door) door.classList.add('enter');
    pfEl.style.transition = 'transform .55s cubic-bezier(.55,0,.8,.5), opacity .5s ease .1s';
    pfEl.style.transform = `translate(${tx}px,${ty}px) scale(.08) rotate(200deg)`;
    pfEl.style.opacity = '0';
  }, 320);
  setTimeout(done, 1000);
}
function pfWin(){
  pfActive = false; pfDraw();
  pfEnterExit(() => {
    if(pfLevel === 1){ pfNextLevel(); return; }
    send('finalwin', {});
    show('screen-win');
  });
}
function startPlatformer(){
  if(pfStarted) return;
  pfStarted = true; p1Stage = 5;
  buildPlatformer();
  $('platformer-section').classList.add('visible');
  setTimeout(() => {
    $('platformer-section').scrollIntoView({behavior:'smooth', block:'center'});
    pfLoop();
  }, 600);
}
// Player 2 side: controls + live sync of the tetris grid
function startMazeSpin(){
  const id = ++mzLoopId; let last = performance.now();
  mzActive = true;
  const f = now => {
    if(!mzActive || id !== mzLoopId) return;
    mz.a += (mzDir || 0) * RSPEED * Math.min((now - last) / 1000, .1); last = now;
    drawMaze();
    requestAnimationFrame(f);
  };
  requestAnimationFrame(f);
}
function startLevel6(){ if(platMode) resetBoard(); } // fresh grid for the taller platformer (also syncs to Player 1)
function startLevel5(){
  if(platMode) return;
  platMode = true;
  if(mz && ballEl){                // the ball is gone, but the maze keeps rotating with Player 1's buttons
    ballEl.style.display = 'none';
    $('maze').style.transition = '';
    startMazeSpin();
  }
  resetBoard();                 // fresh grid to build the path on (also syncs to Player 1)
  $('controls-section').classList.add('visible');
  setTimeout(() => $('controls-section').scrollIntoView({behavior:'smooth', block:'center'}), 600);
}
const inKb = {l:0,r:0,u:0}, inBt = {l:0,r:0,u:0};
let inSent = {l:0,r:0,u:0};
function syncInput(){
  const e = {};
  for(const k of ['l','r','u']){ e[k] = (inKb[k] || inBt[k]) ? 1 : 0; $('pbtn-' + k).classList.toggle('held', !!e[k]); }
  if(e.l !== inSent.l || e.r !== inSent.r || e.u !== inSent.u){ inSent = e; send('input', e); }
}
function btnHold(k){ inBt[k] = 1; syncInput(); }
function btnRelease(k){ if(inBt[k]){ inBt[k] = 0; syncInput(); } }
const KEYS = {ArrowLeft:'l', KeyA:'l', ArrowRight:'r', KeyD:'r', ArrowUp:'u', KeyW:'u'};
document.addEventListener('keydown', e => { const k = KEYS[e.code]; if(!k || !platMode || myRole !== 2) return; e.preventDefault(); inKb[k] = 1; syncInput(); });
document.addEventListener('keyup', e => { const k = KEYS[e.code]; if(!k || !platMode || myRole !== 2) return; e.preventDefault(); inKb[k] = 0; syncInput(); });
window.addEventListener('blur', () => { if(!platMode) return; for(const k of ['l','r','u']){ inKb[k] = 0; inBt[k] = 0; } syncInput(); });
// once a reveal finishes, let its content overflow (so glows/shadows aren't clipped)
document.addEventListener('transitionend', e => {
  if(e.propertyName === 'grid-template-rows' && e.target.classList && e.target.classList.contains('reveal') && e.target.classList.contains('visible')) e.target.classList.add('open');
});

let chargedPiece = null;
buildGrid(5);
buildTray();
buildHeartPreview();
buildColorPreview();
buildSubmitPreview();
</script>
